[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with constrained decoding on a small LLM"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "numpy",
    "llm-sdk",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[dependency-groups]
dev = [
    "pytest",
    "flake8",
    "mypy",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
exclude = ['^llm_sdk/', '^\.venv/']

[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
ignore_errors = true